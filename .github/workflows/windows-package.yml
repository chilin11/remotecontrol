name: Build and publish macOS + Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.1'

      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'

      - name: Install locked dependencies
        shell: pwsh
        run: |
          npm install --global pnpm@10.28.2
          if ($LASTEXITCODE -ne 0) { throw 'pnpm installation failed' }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Dependency installation failed' }

      - name: Build complete Windows desktop package
        shell: pwsh
        run: |
          pnpm package:windows
          if ($LASTEXITCODE -ne 0) { throw 'Windows packaging failed' }

      - name: Run Windows and desktop checks
        shell: pwsh
        run: |
          node --test tests/windows-desktop.test.mjs tests/windows-setup.test.mjs tests/windows-video-limits.test.mjs tests/platform.test.mjs tests/desktop.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Windows tests failed' }

      - name: Verify extracted ZIP and SHA-256
        shell: pwsh
        run: |
          $zip = 'release/RemoteControl-windows-x64.zip'
          $expected = ((Get-Content "$zip.sha256" -Raw).Trim() -split '\s+')[0]
          $actual = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'Package SHA-256 mismatch' }
          $verify = Join-Path $env:RUNNER_TEMP 'remotecontrol-zip-check'
          Expand-Archive -LiteralPath $zip -DestinationPath $verify
          $root = Join-Path $verify 'RemoteControl-Windows'
          foreach ($file in @('RemoteControl.exe', 'runtime/node.exe', 'ffmpeg/ffmpeg.exe', 'ffmpeg/THIRD-PARTY.txt', 'dist/index.html', 'dist-server/desktop.js', 'node_modules/ws/package.json', 'node_modules/@node-rs/argon2-win32-x64-msvc/package.json', 'WINDOWS-DEPLOY.md')) {
            if (-not (Test-Path (Join-Path $root $file) -PathType Leaf)) { throw "Missing ZIP component: $file" }
          }
          Push-Location $root
          try {
            & './runtime/node.exe' --input-type=module -e "import {hash,verify} from '@node-rs/argon2'; import WebSocket from 'ws'; import {DatabaseSync} from 'node:sqlite'; const h=await hash('zip-validation'); if(!await verify(h,'zip-validation')) throw Error('argon2 failed'); new DatabaseSync(':memory:').close(); console.log('Extracted ZIP runtime OK',process.version,typeof WebSocket);"
            if ($LASTEXITCODE -ne 0) { throw 'Extracted ZIP runtime check failed' }
          } finally { Pop-Location }
          "## Windows desktop ZIP verified`n`nSource commit: $env:GITHUB_SHA`n`nSHA-256: $actual`n`nPublication waits for both macOS and Windows builds to succeed. Interactive desktop, tray, UAC, and login startup still need real-PC verification." >> $env:GITHUB_STEP_SUMMARY

      - name: Upload installable ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Windows-desktop-x64
          path: |
            release/RemoteControl-windows-x64.zip
            release/RemoteControl-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  macos:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      # Ephemeral CI has no persistent local identity or Developer ID credentials. Do not generate a
      # misleading "stable" certificate on each runner, and never upload a developer's private key.
      REMOTECONTROL_SIGN_IDENTITY: '-'
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.14.1'

      - name: Install .NET 8 SDK for cross-platform regression checks
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'

      - name: Install locked dependencies
        run: |
          test "$(uname -m)" = arm64
          npm install --global pnpm@10.28.2
          pnpm install --frozen-lockfile

      - name: Build complete macOS DMG and ZIP
        run: pnpm package:mac

      - name: Run macOS and gateway checks
        run: node --test tests/*.test.mjs

      - name: Verify macOS signature, deployment target and archives
        run: |
          codesign --verify --deep --strict release/RemoteControlAgent.app
          test "$(vtool -show-build release/RemoteControlAgent.app/Contents/MacOS/RemoteControlAgent | awk '/minos/ {print $2}')" = 13.5
          cd release
          shasum -a 256 -c RemoteControl-mac-arm64.dmg.sha256
          shasum -a 256 -c RemoteControl-mac-arm64.zip.sha256
          echo 'macOS DMG/ZIP verified; publication waits for Windows.' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload macOS installers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macOS-desktop-arm64
          path: |
            release/RemoteControl-mac-arm64.dmg
            release/RemoteControl-mac-arm64.dmg.sha256
            release/RemoteControl-mac-arm64.zip
            release/RemoteControl-mac-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download both platforms' verified installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release
          merge-multiple: true

      - name: Verify complete release assets
        run: |
          cd release
          for package in RemoteControl-mac-arm64.dmg RemoteControl-mac-arm64.zip RemoteControl-windows-x64.zip; do
            test -s "$package"
            test -s "$package.sha256"
            sha256sum -c "$package.sha256"
          done

      - name: Publish both platforms in one GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          short="${GITHUB_SHA:0:7}"
          tag="desktop-build-${GITHUB_RUN_NUMBER}-${short}"
          notes="$RUNNER_TEMP/desktop-release-notes.md"
          cat > "$notes" <<EOF
          ## macOS + Windows desktop packages

          Both platforms are built from the same commit: $GITHUB_SHA.

          - **macOS (Apple Silicon, 13.5+)**: Download **RemoteControl-mac-arm64.dmg**, drag the App into Applications, then grant Screen Recording and Accessibility. ZIP alternative included. Menu-bar operation and optional user-login startup.
          - **Windows (10/11 x64)**: Download **RemoteControl-windows-x64.zip**, extract the entire ZIP to a fixed folder and open **RemoteControl.exe**. Tray operation and optional user-login startup; LAN firewall setup needs one local UAC confirmation.
          - No separate Node, .NET or FFmpeg installation is required on the target computer. Do not download Source code for installation.

          Both builds, platform tests, bundled runtime checks and all SHA-256 checks passed. Interactive screen/input, system permissions and login startup still require real-machine verification.

          **Development-signing limits:** macOS CI uses ad-hoc signing (not Developer ID/notarized); Gatekeeper may block downloaded builds, and updates may require permission reapproval. No security policies are disabled. Windows has no Authenticode signature; SmartScreen may show an unknown publisher.

          Build details: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Remote Control — macOS + Windows build $GITHUB_RUN_NUMBER ($short)" --notes-file "$notes" --draft
          fi
          gh release upload "$tag" release/RemoteControl-mac-arm64.dmg release/RemoteControl-mac-arm64.dmg.sha256 release/RemoteControl-mac-arm64.zip release/RemoteControl-mac-arm64.zip.sha256 release/RemoteControl-windows-x64.zip release/RemoteControl-windows-x64.zip.sha256 --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          echo "## Both platforms published" >> "$GITHUB_STEP_SUMMARY"
          echo "https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
